<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<meta name="description" content="Stryke — оценивай стартапы, делай прогнозы и обсуждай проекты.">
<title>Stryke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Russo+One&display=swap">
<link rel="stylesheet" href="css/style.css">
<!-- Supabase: общая база голосов и комментариев. Настройки — в js/config.js -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
<script src="js/config.js" defer></script>
<script src="js/data.js" defer></script>
<script src="js/app.js" defer></script>
</head>
<body>
<!--BODY-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="bolt-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e4ff8f"/><stop offset=".55" stop-color="#bff23b"/><stop offset="1" stop-color="#9ed11c"/></linearGradient>
    <symbol id="bolt" viewBox="0 0 22 26"><path fill="url(#bolt-g)" d="M15.5 0 2 15h7.2L6.3 26 20 10.4h-7.4z"/></symbol>
    <symbol id="i-feed" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 4h16v7H4zM4 15h7v5H4zM15 15h5v5h-5z"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M6 3h12v18l-6-4.5L6 21z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" stroke-linecap="round"/></g></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 5h16v11H9l-5 4z"/></symbol>
    <symbol id="i-why" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6v.6"/><path d="M12 17.2v.1"/></g></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h16M7 12h10M10 18h4"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M6 15l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></symbol>
  </defs>
</svg>

<div class="app">
  <aside class="side-l"><div>
    <div class="logo"><svg><use href="#bolt"/></svg>STRYKE</div>
    <nav class="snav" id="snav" aria-label="Разделы"></nav>
    <p class="tagline">Оценивай стартапы.<br>Делись мнением.<br>Развивай инвестиционное мышление.</p>
  </div></aside>

  <main class="main">
    <div class="stage" id="stage">
      <header class="rtop" id="rtop"></header>
      <div class="reel" id="reel" aria-label="Лента проектов"></div>
      <div class="reel-nav" aria-hidden="false">
        <button data-act="prev" aria-label="Предыдущий проект"><svg><use href="#i-up"/></svg></button>
        <button data-act="next" aria-label="Следующий проект"><svg><use href="#i-down"/></svg></button>
      </div>
    </div>
    <section class="page" id="page" hidden></section>
  </main>

  <aside class="side-r"><div id="side-r"></div></aside>
</div>

<nav class="bnav" id="bnav" aria-label="Разделы"></nav>
<div class="scrim" id="scrim" data-act="sheet-close" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="toast" id="toast" hidden></div>
<!--/BODY-->
</body>
</html>
